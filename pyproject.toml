[project]
name = "clustersound"
version = "0.6.0"
description = "Classifica e raggruppa in 3D una libreria di sample audio (kick, snare, hat, …)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.0", "h5py"]
midi = ["python-rtmidi>=1.5"]  # Compose: record a melody from a MIDI keyboard
# Recorder: "all outputs" through ScreenCaptureKit when the cs-tap helper (macOS 14.2+) is missing
# Recorder: stem separation (drums, bass, guitar, vocals) with Demucs, on the Mac only
stems = ["demucs>=4.0.1", "torch>=2.1"]
# Recorder: "Migliora" (AI restoration of samples) with Apollo, on the Mac only
enhance = ["torch>=2.1", "huggingface_hub>=0.20"]
capture = ["pyobjc-framework-ScreenCaptureKit>=10", "pyobjc-framework-CoreMedia>=10"]

[project.scripts]
clustersound = "clustersound.__main__:main"

[tool.setuptools.packages.find]
include = ["clustersound*"]

[tool.setuptools.package-data]
clustersound = ["models/*", "ui/*", "ui/vendor/*", "ui/vendor/**/*", "ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
