name: release

# A vX.Y.Z tag on main builds ClusterSound.app for Apple Silicon and Intel and publishes both zips as a GitHub
# Release. Run by hand (workflow_dispatch) it only builds and keeps the zips as workflow artifacts.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Check tag against main and pyproject
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v${{ steps.version.outputs.version }}" ] \
            || { echo "::error::tag $GITHUB_REF_NAME != pyproject version ${{ steps.version.outputs.version }}"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m venv .venv
          # PyTorch publishes no Intel-macOS wheels after 2.2.2, which still needs NumPy 1.x; Demucs 4.1 needs
          # sphn, which has no Intel-macOS wheels either (stems.py also handles 4.0.1, without demucs.hf)
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            printf 'torch==2.2.2\ntorchaudio==2.2.2\nnumpy<2\ndemucs==4.0.1\n' > constraints.txt
          else
            : > constraints.txt
          fi
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -c constraints.txt ".[dev,midi,capture,stems,enhance]"

      - name: Build ClusterSound.app
        run: sh tools/build_app.sh

      - name: Sign ad hoc
        run: codesign --force --deep --sign - dist/ClusterSound.app

      - name: Smoke test
        run: dist/ClusterSound.app/Contents/MacOS/ClusterSound --headless "$(mktemp -d)"

      - name: Zip
        id: zip
        run: |
          name="ClusterSound-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent dist/ClusterSound.app "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ClusterSound-macos-${{ matrix.arch }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Download**: `macos-arm64` for Apple Silicon (M1 and later), `macos-x86_64` for Intel Macs.

          The app is not notarized: on first launch right-click ClusterSound.app → **Open**, or run
          `xattr -cr ClusterSound.app` once.
          EOF
          gh release create "$GITHUB_REF_NAME" ClusterSound-*.zip \
            --title "ClusterSound ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes --verify-tag
