site_name: ClusterSound
site_description: Classify, explore in 3D and put to work a library of audio samples.
site_url: https://aleksattanasio.github.io/ClusterSound/
repo_url: https://github.com/AleksAttanasio/ClusterSound
repo_name: AleksAttanasio/ClusterSound
edit_uri: edit/main/docs/
copyright: ClusterSound

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: it
          name: Italiano
          build: true
          site_description: Classifica, esplora in 3D e mette al lavoro una libreria di sample audio.
          theme:
            palette:
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Tema chiaro
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Tema scuro
          nav_translations:
            Quick start: Guida rapida
            Installation: Installazione
            First launch: Primo avvio
            Building the app: Build dell'app
            Troubleshooting: Risoluzione problemi
            Manual: Manuale
            Interface: Interfaccia
            Library: Libreria
            Melody: Melodia
            Technical: Tecnica
            Architecture: Architettura
            Data and persistence: Dati e persistenza
            Live integration: Integrazione con Live
            Development and tests: Sviluppo e test
            AI models: Modelli AI
            Classifier: Classificatore
            Apollo (Enhance): Apollo (Migliora)
            Algorithms: Algoritmi
            Audio analysis: Analisi audio
            Classification: Classificazione
            Clustering and 3D map: Clustering e mappa 3D
            Choosing the Drum Rack samples: Scelta dei sample nei Drum Rack
            Sequencer and groove: Sequencer e groove
            Harmony and chords: Armonia e accordi
            Recorder and slicing: Recorder e slicing
            Reference: Riferimento
            Classes: Classi
            Settings: Impostazioni
            Shortcuts: Scorciatoie

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Quick start:
      - guide/index.md
      - Installation: guide/installation.md
      - First launch: guide/first-launch.md
      - Ableton Live: guide/ableton-live.md
      - Building the app: guide/build.md
      - Troubleshooting: guide/troubleshooting.md
  - Manual:
      - manual/index.md
      - Interface: manual/interface.md
      - Library: manual/library.md
      - Store: manual/store.md
      - Recorder: manual/recorder.md
      - Sequencer: manual/sequencer.md
      - Drum Rack: manual/drum-rack.md
      - Compose: manual/compose.md
      - Melody: manual/melody.md
      - Max for Live: manual/max-for-live.md
  - Technical:
      - technical/index.md
      - Architecture: technical/architecture.md
      - Backend: technical/backend.md
      - Frontend: technical/frontend.md
      - Data and persistence: technical/data-and-persistence.md
      - Live integration: technical/live-integration.md
      - Development and tests: technical/development.md
  - AI models:
      - ai/index.md
      - YAMNet: ai/yamnet.md
      - Classifier: ai/classifier.md
      - Demucs (stems): ai/demucs.md
      - Apollo (Enhance): ai/apollo.md
  - Algorithms:
      - algorithms/index.md
      - Audio analysis: algorithms/audio-analysis.md
      - Classification: algorithms/classification.md
      - Clustering and 3D map: algorithms/clustering-and-map.md
      - Choosing the Drum Rack samples: algorithms/drum-rack.md
      - Sequencer and groove: algorithms/sequencer.md
      - Harmony and chords: algorithms/harmony.md
      - Melody: algorithms/melody.md
      - Recorder and slicing: algorithms/recorder-and-slicing.md
      - Store: algorithms/store.md
  - Reference:
      - Classes: reference/classes.md
      - Settings: reference/settings.md
      - Shortcuts: reference/shortcuts.md
